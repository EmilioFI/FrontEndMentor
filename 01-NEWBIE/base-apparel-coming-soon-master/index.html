<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>

    <title>Frontend Mentor | Base Apparel coming soon page</title>
  </head>
  <body>
    <main>
      <div class="logo">
        <img src="./images/logo.svg" alt="base apparel logo" />
      </div>
      <div class="container">
        <article class="info-block">
          <h1 class="title">
            <span class="title__word">We're</span>
            <span class="title__word title__word--highlight">coming</span>
            <span class="title__word title__word--highlight">soon</span>
          </h1>
          <p class="info-text">
            Hello fellow shoppers! We're currently building our new fashion
            store. Add your email below to stay up-to-date with announcements
            and our launch deals. Email Address
          </p>
        </article>
        <form id="email-form" action="" novalidate>
          <div class="form-container">
            <label for="GET-email" class="visually-hidden">Email Address</label>
            <input
              class="email-field"
              id="GET-email"
              type="email"
              placeholder="Email Address"
              aria-describedby="email-message"
              required
            />
            <button class="submit-btn" type="submit" aria-label="submit email">
              <img src="./images/icon-arrow.svg" alt="" />
            </button>
            <img
              class="warning-icon hidden"
              src="./images/icon-error.svg"
              alt=""
            />
          </div>
          <span
            class="info-message"
            id="email-message"
            aria-live="polite"
          ></span>
        </form>
      </div>
      <div class="hero-container"></div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
